# Black Pill F411CE micro-quad carrier (rev B): 100 MHz Cortex-M4F,
# 512 KB flash, 128 KB SRAM. Driver enablement for the devices wired in
# blackpill_f411ce.overlay plus footprint trims over the developer-fat
# prj.conf.

# Motors: cognipilot,pwm-motors bank across TIM3/TIM1 with NSLEEP + FAULT.
CONFIG_PWM=y
CONFIG_GPIO=y

# IMU: BMI270 on SPI1, data-ready trigger backend (no RTIO streaming in the
# BMI270 driver). Own trigger thread keeps bus reads off the system workqueue.
CONFIG_SPI=y
CONFIG_SENSOR=y
CONFIG_RDD2_IMU_TRIGGER=y
CONFIG_RDD2_IMU_TRIGGER_ODR_HZ=800
CONFIG_BMI270_TRIGGER_OWN_THREAD=y

# Battery divider on PB0 -> ADC1_IN8. Arm gate stays off until the rev-B
# board with the divider populated is verified on the bench.
CONFIG_ADC=y
CONFIG_RDD2_BATTERY=y
# CONFIG_RDD2_BATTERY_ARM_GATE=y

# Communication: one synapse serial link to the ESP32-C3 WiFi bridge on
# USART2 carries telemetry out and RC (ManualControl) in.
CONFIG_RDD2_ZROS_SERIAL=y
CONFIG_RDD2_RC_SYNAPSE=y
CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y

CONFIG_PINCTRL=y
CONFIG_CLOCK_CONTROL=y

# 128 KB SRAM trims: drop the developer conveniences prj.conf turns on.
# Re-enable selectively when debugging on the bench.
CONFIG_TOP_SHELL=n
CONFIG_THREAD_MONITOR=n
CONFIG_THREAD_RUNTIME_STATS=n
CONFIG_THREAD_STACK_INFO=n
CONFIG_INIT_STACKS=n
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_LOG_DEFAULT_LEVEL=1

# The serial shell on USART1 stays on for bring-up. For flight builds set
# CONFIG_SHELL=n (and CONFIG_ZROS_SHELL=n, CONFIG_CSYN_SHELL=n, CONFIG_LOG=n)
# to reclaim RAM.
