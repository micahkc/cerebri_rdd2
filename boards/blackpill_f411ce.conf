# Black Pill F411CE: 100 MHz Cortex-M4F, 512 KB flash, 128 KB SRAM.
# Driver enablement for the devices wired in blackpill_f411ce.overlay,
# plus footprint trims relative to the developer-fat prj.conf.

# Motors: generic PWM on TIM4. STM32 timer channels are 1-based.
CONFIG_PWM=y
CONFIG_RDD2_PWM_FIRST_CHANNEL=1

# IMU: ICM-42688 on SPI1, streamed over RTIO from the data-ready interrupt.
CONFIG_SPI=y
CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y
CONFIG_ICM4268X_STREAM=y

# RC input: CRSF on USART2.
CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y
CONFIG_INPUT_CRSF=y
CONFIG_INPUT_CRSF_SEND_SYNC=y
CONFIG_INPUT_CRSF_REPORT_FILTER=1
CONFIG_INPUT_CRSF_THREAD_PRIORITY=1
CONFIG_INPUT_CRSF_THREAD_STACK_SIZE=2048

CONFIG_PINCTRL=y
CONFIG_CLOCK_CONTROL=y

# 128 KB SRAM trims: drop the developer conveniences prj.conf turns on.
# Re-enable selectively when debugging on the bench.
CONFIG_TOP_SHELL=n
CONFIG_THREAD_MONITOR=n
CONFIG_THREAD_RUNTIME_STATS=n
CONFIG_THREAD_STACK_INFO=n
CONFIG_INIT_STACKS=n
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_LOG_DEFAULT_LEVEL=1

# The serial shell on USART1 stays on for bring-up. For flight builds set
# CONFIG_SHELL=n (and CONFIG_ZROS_SHELL=n, CONFIG_CSYN_SHELL=n, CONFIG_LOG=n)
# to reclaim RAM, which also frees USART1 for zros-serial telemetry.
